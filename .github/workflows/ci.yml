name: Nyaya AI CI Quality & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-quality-gate:
    name: Backend Test Suite & Security Gate
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          APP_ENV: test
          MONGODB_URL: mongodb://localhost:27017/nyaya_test
          MONGODB_DATABASE: nyaya_test
          JWT_SECRET: test_jwt_secret_minimum_32_bytes_long_string
          LLM_API_KEY: test-mock-key
        run: |
          pytest

      - name: Python CompileAll Verification
        working-directory: backend
        run: |
          python -m compileall app

      - name: Pip Dependency Check
        working-directory: backend
        run: |
          pip check

  frontend-build-gate:
    name: Frontend Production Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Frontend Production Build
        working-directory: frontend
        run: |
          npm run build

  rag-safety-eval-gate:
    name: RAG Legal Answer & Safety Evaluation Gate
    runs-on: ubuntu-latest
    needs: [backend-quality-gate]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run 60-Scenario Deterministic RAG Evaluation Suite
        working-directory: backend
        env:
          APP_ENV: test
          MONGODB_URL: mongodb://localhost:27017/nyaya_eval
          MONGODB_DATABASE: nyaya_eval
          JWT_SECRET: test_jwt_secret_minimum_32_bytes_long_string
          LLM_API_KEY: test-mock-key
        run: |
          pytest tests/test_rag_evaluation.py

  e2e-critical-smoke-gate:
    name: Critical Browser E2E Smoke Gate
    runs-on: ubuntu-latest
    needs: [backend-quality-gate, frontend-build-gate]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Run Backend Test Server in Background
        working-directory: backend
        env:
          APP_ENV: test
          MONGODB_URL: mongodb://localhost:27017/nyaya_e2e
          MONGODB_DATABASE: nyaya_e2e
          JWT_SECRET: test_jwt_secret_minimum_32_bytes_long_string
          LLM_API_KEY: test-mock-key
        run: |
          python e2e_test_server.py &

      - name: Run Critical E2E Smoke Suite
        working-directory: frontend
        run: |
          npm run test:e2e:smoke
